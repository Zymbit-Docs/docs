name: Deploy docs site via GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

# Read-only unless a job asks for more. Only this workflow can publish the site,
# and the github-pages environment accepts deployments from main alone, so a
# workflow on any other branch cannot change docs.zymbit.com.
permissions:
  contents: read

# Let a running deployment finish rather than cancel it partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Generate static docs site using Hugo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          
      # KEEP IN SYNC with the "hugo-extended" pin in package.json. The version lives
      # in two places, and when they drift, `npm run build` stops matching production
      # -- which is how the local build came to be broken against Hugo 0.91 while CI
      # was building fine on 0.151.1.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.1'
          extended: true

      - name: Fail if the local Hugo pin has drifted from this workflow
        run: |
          pinned=$(node -p "require('./package.json').devDependencies['hugo-extended']")
          if [ "$pinned" != "0.151.1" ]; then
            echo "::error::package.json pins hugo-extended at '$pinned' but this workflow builds with 0.151.1."
            echo "Update both together so local builds match production."
            exit 1
          fi
          echo "Hugo pin matches: $pinned"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm install
        
      - name: Print npm dependency versions
        run: npm version
        
      - name: Build static site with Hugo
        run: hugo --gc --minify

      # Pagefind indexes the rendered HTML in public/, so it must run after Hugo and
      # before the deploy. It writes public/pagefind/, which the site fetches lazily
      # on first search. Pinned so a Pagefind release cannot change search behavior
      # without a deliberate bump.
      - name: Build search index with Pagefind
        run: npx --yes pagefind@1.3.0 --site public

      - name: Verify search index was generated
        run: |
          test -f public/pagefind/pagefind.js || {
            echo "::error::Pagefind index missing - search would silently 404"
            exit 1
          }
          echo "Pagefind index size: $(du -sh public/pagefind | cut -f1)"

      # The custom domain (docs.zymbit.com) is set in the repo's Pages settings, so
      # the artifact needs no CNAME file.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
