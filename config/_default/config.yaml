# Hostname (and path) to the root
baseurl: "https://docs.zymbit.com"

# Site name. This is `.Site.Title`, which partials/head.html appends to every page
# title. It was never set -- the name lived only in params.yaml as
# `.Site.Params.title` -- so `.Site.Title` was empty and every page emitted a title
# ending in a dangling " | ", visible in search results across the whole site.
title: "Zymbit Documentation"

# General site configuration
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
languageCode: "en-US"
pagination: 
  papersize: 7

rssLimit: 10

theme:
  - zymdocsy

# SITEMAP belongs on the home page: that is what produces the single /sitemap.xml
# search engines look for, and what robots.txt advertises.
#
# It used to be listed under `section` instead, with a hand-rolled SITEMAP output
# format. That generated 54 per-section sitemaps (one per section, at paths like
# /hardware/sitemap.xml) and no root sitemap at all. Nothing linked to any of them
# and robots.txt named none, so no crawler could discover them -- the site
# effectively had no sitemap, and https://docs.zymbit.com/sitemap.xml returned 404.
#
# The custom outputFormats.SITEMAP block is gone with it; Hugo's built-in sitemap
# format and template do the job, and the hand-rolled one declared isPlainText: true,
# which is what produced the "found no layout file for sitemap" build warnings.
#
# RSS is deliberately still not listed here. Hugo's default home outputs are
# HTML + RSS + sitemap, and dropping RSS predates this change; re-enabling it is a
# separate decision, not a side effect of fixing the sitemap.
outputs:
  home:
    - HTML
    - SITEMAP
  section:
    - HTML

params:
# Does Bootware versioning
  version_menu: "Choose Bootware Version"
  version_menu_pagelinks: false
  versions:
    - version: "2.0.0"
      url: "https://docs.zymbit.com/bootware/2.0.0/"
    - version: "1.3.2"
      url: "https://docs.zymbit.com/bootware/1.3.2/"
    - version: "1.3.0"
      url: "https://docs.zymbit.com/bootware/1.3.0/"
    - version: "1.2.2"
      url: "https://docs.zymbit.com/bootware/1.2.2/"
    - version: "1.1.0"
      url: "https://docs.zymbit.com/bootware/1.1.0/"
    - version: "1.0.0"
      url: "https://docs.zymbit.com/bootware/1.0.0/"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
  goldmark:
    extensions:
      linkify: false
      table: true
      taskList: true
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: monokai
    tabWidth: 4

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

taxonomies:
  category: categories
  tag: tags

permalinks:
  docs: "/:sections/:slug/"

# Because this is primarily a docs site, we want all of our pages to use the
# docs formatting. Normally, the layout is chosen by the name of the first
# directory under `content/`. Since we don't want to have to put `type: docs`
# in every page or have to put the entire site within a `content/docs/` directory,
# we can define cascading frontmatter that causes every page below this to
# inherit `type: docs`
#
# Any other key-value pairs added under the `cascade` key will be inherited by
# every other site page. More information about front matter cascades:
# https://gohugo.io/content-management/front-matter#front-matter-cascade
cascade:
  type: docs
