---

# Global navigation.
#
# Before this, the only two entries were Community and zymbit.com -- both of which
# leave the site. Every documentation section was reachable only by expanding the
# left sidebar tree, so a reader arriving on a deep page from a search engine had no
# visible way to see what else the docs cover.
#
# Products and Tasks lead: they are the two doors most readers actually want. Someone
# holding a SEN 500 is served better by that product's hub than by a directory of all
# hardware, and someone trying to encrypt a filesystem is served better by the task
# index than by a list of tutorials.
#
# Hardware and Tutorials are deliberately NOT in this menu. They keep their URLs, stay
# in the sidebar tree, and are linked from every hub and every task row -- but the
# navbar is a single row and these two are reached better through Products and Tasks.
# The remaining four are sections nothing else fronts.
#
# The two outbound links stay last and keep their icons, which usefully marks them as
# leaving the site.
#
# `pageRef` rather than `url`: it populates `.Page` on the menu entry, which is what
# partials/navbar.html needs to mark a section active while the reader is anywhere
# beneath it (`$.IsDescendant`). A plain `url` leaves `.Page` nil and highlights only
# the section's own landing page.
#
# Labels are deliberately shorter than the section titles -- "API" rather than
# "Zymbit Driver API", "Troubleshooting" rather than "FAQ and Troubleshooting" --
# because the navbar is a single row that scrolls horizontally below the md
# breakpoint.

main:
  - name: Products
    pageRef: /products
    weight: 10

  - name: Tasks
    pageRef: /tasks
    weight: 20

  - name: Bootware
    pageRef: /bootware
    weight: 30

  - name: API
    pageRef: /api
    weight: 40

  - name: Reference
    pageRef: /reference
    weight: 50

  - name: Troubleshooting
    pageRef: /troubleshooting
    weight: 60

  - name: Community
    pre: "<i class=\"fab fa-discourse\"></i>"
    url: https://community.zymbit.com/
    weight: 90

  - name: zymbit.com
    pre: "<i class=\"fa fa-home\"></i>"
    url: https://zymbit.com
    weight: 100
